#cloud-config
# sip-lab (projects/voip-school-sip/lab/LAB.md): Debian 13 x64. Recording box first; becomes the student's file after it
# has been run end to end. Every package from apt; OpenSIPS from apt.opensips.org trixie 4.0-releases (amd64 only).
users:
  - name: lab
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...replace-with-your-public-key you@laptop
ssh_pwauth: false
disable_root: true
package_update: true
# conntrack (the router's NAT table) and coturn (STUN/TURN server; disabled below, take-nat.sh starts it): section 4 NAT takes
packages: [curl, gnupg, ca-certificates, ufw, sngrep, tcpdump, sip-tester, baresip, nano, git, bind9-dnsutils, dnsmasq-base, sqlite3, tcpreplay, iproute2, conntrack, coturn]
runcmd:
  - [sh, -c, "echo 'wireshark-common wireshark-common/install-setuid boolean false' | debconf-set-selections"]
  - [sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y tshark"]
  # the repo list is written only after its key exists (2026-10-27: a list written first broke the first apt update)
  - [sh, -c, "curl -fsSL https://apt.opensips.org/opensips-org.gpg -o /usr/share/keyrings/opensips-org.gpg && echo 'deb [signed-by=/usr/share/keyrings/opensips-org.gpg] https://apt.opensips.org trixie 4.0-releases' > /etc/apt/sources.list.d/opensips.list && apt-get update"]
  - [sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y opensips opensips-cli opensips-auth-modules opensips-sqlite-module"]
  - [sh, -c, "for p in opensips-tls-module opensips-tls-openssl-module opensips-tlsmgm-module opensips-wss-module opensips-presence-modules; do DEBIAN_FRONTEND=noninteractive apt-get install -y $p || echo \"sip-lab: optional $p failed\" >> /var/log/sip-lab-init.log; done"]
  - [sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rtpengine-daemon rtpengine-utils && systemctl disable --now rtpengine-daemon"]
  - [sh, -c, "systemctl disable --now opensips || true"]
  - [sh, -c, "systemctl disable --now coturn || true"]
  - [sh, -c, "ufw default deny incoming && ufw allow 22/tcp && ufw --force enable"]
  # the lab scripts (takes, SIPp scenarios, lab.cfg) from the course's public repo, into /home/lab/lab
  - [sh, -c, "git clone --depth 1 https://github.com/flaviogoncalves/sip-blackbelt-lab /home/lab/lab && chown -R lab:lab /home/lab/lab"]
  - [sh, -c, "dpkg-query -W opensips opensips-cli rtpengine-daemon sip-tester baresip sngrep tshark >> /var/log/sip-lab-init.log; echo sip-lab-ready >> /var/log/sip-lab-init.log"]
