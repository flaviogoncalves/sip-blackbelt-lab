#
# sip-lab: one of two SBC nodes behind a front proxy (lesson 7.13, take-scale.sh ticket/ticketfix). The take writes
# @NAME@ (sbc1, sbc2) and @IP@ (192.0.2.31, 192.0.2.32). Each node hides the topology of the calls it carries
# (topology_hiding on top of the dialog module): the dialog state lives in this node only. The socket the front talks
# to is advertised as the front's address, so the phones send every in-dialog request to the front (192.0.2.10), as
# they would to a service address. Toward the phones (2001-2003 = 192.0.2.21-.23, no registration) the node uses its
# own address. No digest: the front is trusted.
#

log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=2
auto_aliases=no

socket=udp:@IP@:5060 as 192.0.2.10:5060	# from the front; Contact toward the caller = the front's address
socket=udp:@IP@:5070			# toward the phones

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/run/opensips/@NAME@_fifo")
modparam("mi_fifo", "fifo_mode", 0666)
loadmodule "dialog.so"
loadmodule "topology_hiding.so"
loadmodule "proto_udp.so"

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		# an in-dialog request: it carries no Route (topology hiding removed them); its dialog must be here
		if (topology_hiding_match()) {
			xlog("L_NOTICE", "@NAME@: in-dialog $rm for $ci: dialog found\n");
			t_relay();
			exit;
		}
		if (is_method("ACK")) {
			if (t_check_trans())
				t_relay();
			else
				xlog("L_NOTICE", "@NAME@: ACK for $ci: no such dialog here, dropped\n");
			exit;
		}
		# RFC 3261 12.2.2: a request for a dialog this element does not have
		xlog("L_NOTICE", "@NAME@: in-dialog $rm for $ci: no such dialog here: 481\n");
		send_reply(481, "Call/Transaction Does Not Exist");
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	if (!is_method("INVITE")) {
		send_reply(405, "Method Not Allowed");
		exit;
	}

	# the phones behind the SBC: 2001-2003 at 192.0.2.21-.23
	if (!($rU =~ "^200[1-3]$")) {
		send_reply(404, "Not Found");
		exit;
	}
	$ru = "sip:" + $rU + "@192.0.2.2" + $(rU{s.substr,3,1}) + ":5060";	# the phone's own address, as a registrar would
	create_dialog();
	topology_hiding();
	force_send_socket("udp:@IP@:5070");
	xlog("L_NOTICE", "@NAME@: new call $ci to $ru\n");
	t_relay();
}
