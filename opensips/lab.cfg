#
# sip-lab: OpenSIPS 4.0 for the SIP Black Belt traces (projects/voip-school-sip/lab/LAB.md)
# Domain lab.sip on 192.0.2.10 (dummy interface lab0, made by lab/net.sh). Registrar with digest (401), proxy that
# authenticates initial requests (407), record-routing, location lookup. No database: users and passwords below,
# locations in memory. Digest algorithms offered: @DIGEST_ALGS@, filled in by take.sh (default MD5; an empty value is refused by OpenSIPS).
#

log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=2
auto_aliases=no

socket=udp:192.0.2.10:5060
alias="lab.sip"

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
loadmodule "rr.so"
modparam("rr", "append_fromtag", 0)
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")
modparam("mi_fifo", "fifo_mode", 0666)

loadmodule "usrloc.so"
modparam("usrloc", "working_mode_preset", "single-instance-no-db")
loadmodule "registrar.so"
modparam("registrar", "min_expires", 60)

loadmodule "auth.so"
modparam("auth", "calculate_ha1", 1)
modparam("auth", "username_spec", "$avp(userspec)")
modparam("auth", "password_spec", "$avp(passspec)")

loadmodule "proto_udp.so"

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (loose_route()) {
			t_relay();
		} else if (is_method("ACK")) {
			if (t_check_trans())
				t_relay();
		} else {
			send_reply(404, "Not here");
		}
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	t_check_trans();
	$var(algs) = "@DIGEST_ALGS@";   # take.sh writes the algorithms here

	if (is_method("REGISTER")) {
		# a registrar answers 404 for a domain it does not serve (RFC 3261 21.4.5)
		if ($rd != "lab.sip") {
			send_reply(404, "Not Found");
			exit;
		}
		# the lab rejects a too-short binding with 423 + Min-Expires (RFC 3261 21.4.17); the
		# registrar's min_expires would otherwise clamp it to 60 and answer 200
		if ($hdr(Expires) != NULL && $(hdr(Expires){s.int}) > 0 && $(hdr(Expires){s.int}) < 60) {
			append_to_reply("Min-Expires: 60\r\n");
			send_reply(423, "Interval Too Brief");
			exit;
		}
		route(credentials);
		if (!pv_www_authorize("lab.sip")) {
			www_challenge("lab.sip", "auth", $var(algs));
			exit;
		}
		if ($au != $tU) {
			send_reply(403, "Forbidden");
			exit;
		}
		if (!save("location"))
			send_reply(500, "Server Internal Error");
		exit;
	}

	if ($fd == "lab.sip") {
		route(credentials);
		if (!pv_proxy_authorize("lab.sip")) {
			proxy_challenge("lab.sip", "auth", $var(algs));
			exit;
		}
		if ($au != $fU) {
			send_reply(403, "Forbidden");
			exit;
		}
		consume_credentials();
	}

	record_route();
	if (!lookup("location")) {
		send_reply(404, "Not Found");
		exit;
	}
	t_relay();
}

# the lab's users: auth user -> password (fictitious lab credentials, shown in the course)
route[credentials] {
	$avp(userspec) = $au;
	switch ($au) {
		case "2001": $avp(passspec) = "lab-2001-pass"; break;
		case "2002": $avp(passspec) = "lab-2002-pass"; break;
		case "2003": $avp(passspec) = "lab-2003-pass"; break;
		# an unknown auth user still gets a password so the digest check fails and the server challenges again
		default: $avp(passspec) = "no-such-user"; break;
	}
}
