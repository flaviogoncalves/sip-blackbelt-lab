#
# sip-lab: "the carrier" for section 6 (trunks, caller ID, numbers, STIR/SHAKEN, fraud). A second OpenSIPS on the box,
# at 192.0.2.40 (domain carrier.example), with its own rules. The lab's OpenSIPS (lab.cfg, 192.0.2.10) plays the
# customer's proxy/SBC that sends its calls here. Everything is lab-local: no real carrier, no real numbers.
#
# The customer "acme" holds the numbers +44 20 7946 0100 to 0199 (an Ofcom range kept for drama: fictitious).
#   - IP trunk: a source address in the address table, group 1 (the customer's SBC), needs no digest.
#   - Registration trunk: user acme-trunk, password lab-trunk-pass; it REGISTERs (401) and its calls, From
#     <sip:...@carrier.example>, are challenged (407).
#   - Group 2: another network's gateway (interconnect). Anything else is refused: 403 Forbidden.
# Caller ID policy (the carrier's Spec(T), RFC 3325): a customer's call must assert (P-Asserted-Identity) a number of
# its own range, or 403; a PAI from any other source is removed; toward the far end, which is not trusted, the PAI is
# removed when the caller asked for privacy (Privacy: id).
# Calls to numbers go to the far end, 192.0.2.50 (the rest of the telephone network, played by SIPp in the takes);
# calls to the customer's numbers go back over its trunk.
#

log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=2
auto_aliases=no

socket=udp:192.0.2.40:5060
alias="carrier.example"

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
loadmodule "rr.so"
modparam("rr", "append_fromtag", 0)
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/run/opensips/carrier_fifo")
modparam("mi_fifo", "fifo_mode", 0666)

loadmodule "usrloc.so"
modparam("usrloc", "working_mode_preset", "single-instance-no-db")
loadmodule "registrar.so"

loadmodule "auth.so"
modparam("auth", "calculate_ha1", 1)
modparam("auth", "username_spec", "$avp(userspec)")
modparam("auth", "password_spec", "$avp(passspec)")

# the trusted addresses (table "address" in /tmp/lab-carrier, written by the take)
loadmodule "db_text.so"
loadmodule "permissions.so"
modparam("permissions", "db_url", "text:///tmp/lab-carrier")

loadmodule "proto_udp.so"

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (loose_route()) {
			t_relay();
		} else if (is_method("ACK")) {
			if (t_check_trans())
				t_relay();
		} else {
			send_reply(404, "Not here");
		}
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	t_check_trans();

	# OPTIONS to the carrier itself (no user part): a trunk's keepalive ping
	if (is_method("OPTIONS") && $rU == NULL) {
		send_reply(200, "OK");
		exit;
	}

	# the registration trunk registers here
	if (is_method("REGISTER")) {
		if ($rd != "carrier.example") {
			send_reply(404, "Not Found");
			exit;
		}
		route(credentials);
		if (!pv_www_authorize("carrier.example")) {
			www_challenge("carrier.example", "auth", "MD5");
			exit;
		}
		if ($au != $tU) {
			send_reply(403, "Forbidden");
			exit;
		}
		if (!save("location"))
			send_reply(500, "Server Internal Error");
		exit;
	}

	if (!is_method("INVITE")) {
		send_reply(403, "Forbidden");
		exit;
	}

	# who is calling
	if (check_source_address(1)) {
		$var(source) = "customer";        # the customer's SBC: IP trunk
	} else if (check_source_address(2)) {
		$var(source) = "interconnect";    # another network's gateway
	} else if ($fd == "carrier.example") {
		route(credentials);               # registration trunk: digest
		if (!pv_proxy_authorize("carrier.example")) {
			proxy_challenge("carrier.example", "auth", "MD5");
			exit;
		}
		consume_credentials();
		$var(source) = "customer";
	} else {
		xlog("L_NOTICE", "carrier: INVITE from $si:$sp is not from a customer or a peer: 403\n");
		send_reply(403, "Forbidden");
		exit;
	}

	# caller ID: a customer may only assert a number of its own range
	if ($var(source) == "customer") {
		if ($ai == NULL || !($(ai{uri.user}) =~ "^[+]4420794601[0-9][0-9]$")) {
			xlog("L_NOTICE", "carrier: customer call with P-Asserted-Identity <$ai>, not in +44 20 7946 0100-0199: 403\n");
			send_reply(403, "Forbidden");
			exit;
		}
	} else {
		remove_hf("P-Asserted-Identity");   # not asserted by anyone this carrier trusts
	}

	record_route();

	# a call to one of the customer's numbers goes back over its trunk: the registered contact, else the IP trunk
	if ($rU =~ "^[+]4420794601[0-9][0-9]$") {
		$var(did) = $rU;
		$ru = "sip:acme-trunk@carrier.example";
		if (lookup("location"))
			$rU = $var(did);
		else
			$ru = "sip:" + $var(did) + "@192.0.2.10:5060";
		t_relay();
		exit;
	}

	# toward the far end (not trusted): the caller asked for privacy, so no PAI leaves this network (RFC 3325 5)
	if ($hdr(Privacy) != NULL && $hdr(Privacy) =~ "id")
		remove_hf("P-Asserted-Identity");

	$du = "sip:192.0.2.50:5060";   # the far end
	t_relay();
}

# the registration trunk's credentials (fictitious lab credentials, shown in the course)
route[credentials] {
	$avp(userspec) = $au;
	switch ($au) {
		case "acme-trunk": $avp(passspec) = "lab-trunk-pass"; break;
		default: $avp(passspec) = "no-such-user"; break;
	}
}
