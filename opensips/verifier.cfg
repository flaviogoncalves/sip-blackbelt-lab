#
# sip-lab: the terminating network's SBC for lesson 6.4 (STIR/SHAKEN), a third OpenSIPS on the box at 192.0.2.45.
# It runs the verification service of RFC 8224 (stir_shaken module): every INVITE must carry an Identity header that
# verifies against the lab certificate; a call that passes goes on to the called phone (192.0.2.50), with the
# PASSporT's claims in the log; one that fails is refused with the code the module gives (RFC 8224 6.2.2: 428, 436,
# 437, 438, 403 Stale Date). Lab-local: the certificate is not fetched from the x5u URL (there is no such server), it
# is the lab certificate, written into this script by take-trunks.sh, signed by the lab CA (ca_list).
#

log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=2
auto_aliases=no

socket=udp:192.0.2.45:5060

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "stir_shaken.so"
modparam("stir_shaken", "ca_list", "@CA_LIST@")
loadmodule "proto_udp.so"

route {
	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	if (has_totag()) {
		if (loose_route()) {
			t_relay();
		} else if (is_method("ACK")) {
			if (t_check_trans())
				t_relay();
		} else {
			send_reply(404, "Not here");
		}
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	t_check_trans();

	if (is_method("INVITE")) {
		# the certificate named by x5u (lab: written here, not fetched)
		$var(cert) = "@CERT@";
		$var(rc) = stir_shaken_verify($var(cert), $var(err_code), $var(err_reason));
		if ($var(rc) < 0) {
			xlog("L_NOTICE", "verifier: $rU from $fU: verification failed ($var(rc)): $var(err_code) $var(err_reason)\n");
			if ($var(rc) == -1) {
				send_reply(500, "Server Internal Error");
				exit;
			}
			send_reply($var(err_code), $var(err_reason));
			exit;
		}
		xlog("L_NOTICE", "verifier: verified: attest $identity(attest), orig $identity(orig), dest $identity(dest), origid $identity(origid), iat $identity(iat), x5u $identity(x5u)\n");
	}

	record_route();
	$du = "sip:192.0.2.50:5060";   # the called phone
	t_relay();
}
